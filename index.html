<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixel Names – Your Name, Pixel Perfect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 class="sr">Pixel Names</h1>
      <canvas id="title" aria-hidden="true"></canvas>
      <p class="sub">Your Name, Pixel Perfect.</p>
      <p class="lead">See your name in nine language styles.</p>

      <div class="box">
        <input id="name" type="text" maxlength="24"
          placeholder="Type your name…" autocomplete="off"
          aria-label="Your name">
        <button class="go" id="go">Generate ✨</button>
      </div>

      <p class="hint" id="hint">Try: Samarth, Maria or Zoë</p>
    </header>

    <section id="results" aria-live="polite">
      <div class="rh">
        <h2 id="rt"></h2>
        <button class="all" id="all">⬇ Download all (one image)</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <footer>
      Sound-based spellings are approximations, not translations.
    </footer>
  </main>

  <div id="toast"></div>
  <script src="script.js" defer></script>
</body>
</html>
