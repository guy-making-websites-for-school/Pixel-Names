
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Names</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background-pixels" id="backgroundPixels"></div>

  <header>
    <h1 id="title">PIXEL NAMES</h1>
    <p class="subtitle">Turn your name into pixel art across the world!</p>
  </header>

  <main>
    <section class="generator">
      <input
        type="text"
        id="nameInput"
        placeholder="Enter your name..."
        maxlength="30"
      >
      <button id="generateBtn">Generate Names</button>
    </section>

    <p class="instruction">
      Click any language card to open it in fullscreen.
    </p>

    <section id="results" class="results"></section>

    <button id="downloadAll" class="download-all">
      Download All Names
    </button>
  </main>

  <div id="fullscreen" class="fullscreen">
    <div class="fullscreen-content">
      <p id="fullLanguage" class="full-language"></p>
      <h2 id="fullName"></h2>
      <p id="fullNote" class="full-note"></p>

      <canvas id="fullArt"></canvas>

      <button id="fullDownload" class="full-download">
        Download PNG
      </button>
    </div>
  </div>

  <footer>
    <p>Made with pixels and creativity.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
